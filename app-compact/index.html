<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="旅費 Compact" />
    <!-- Public assets use relative hrefs. %BASE_URL% gets joined with Vite base again
         and produces a doubled path (…/compact/…/compact/…) on the dev + GH Pages base. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/themes.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- media="print" keeps offline boot from stalling; theme-boot.js flips media to all.
         No inline onload: production CSP is script-src 'self' and blocks event handlers. -->
    <link data-fonts href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" media="print" />
    <title>旅費 Compact</title>
    <!-- External boot script: production CSP is script-src 'self' (inline scripts are blocked). -->
    <script src="theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
